spring.application.name=elosaude
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Banco de dados - Supabase (PostgreSQL)
# Copie host, porta e usuário em: Supabase > Connect (botão no topo do projeto)
#
# Exemplo (Session pooler, recomendado se sua rede não tem IPv6):
#   SUPABASE_DB_URL=jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USER=postgres.<ref-do-projeto>
#
# Exemplo (conexão direta, exige IPv6):
#   SUPABASE_DB_URL=jdbc:postgresql://db.<ref-do-projeto>.supabase.co:5432/postgres?sslmode=require
#   SUPABASE_DB_USER=postgres
#
# Se usar o Transaction pooler (porta 6543), acrescente &prepareThreshold=0
# à URL, porque ele não aceita prepared statements do driver.
# ---------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: o plano gratuito do Supabase limita conexões simultâneas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ---------------------------------------------------------------------
# Flyway - lê db/migration (V1__schema_inicial.sql, V2__seed_unidades.sql)
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo


spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false


app.security.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-use-48-bytes-ou-mais}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.whatsapp.twilio.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

app.alertas.cron=${ALERTAS_CRON:0 0 * * * *}
app.alertas.encaminhamento-pendente-horas=${ALERTAS_ENCAMINHAMENTO_HORAS:48}

app.cnes.base-url=${CNES_BASE_URL:https://apidadosabertos.saude.gov.br}
app.cnes.timeout-ms=5000

# ---------------------------------------------------------------------
# Actuator e logs
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.br.edu=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}