spring.application.name=projeto
server.port=8080

# Banco de dados - Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.clunohvegizspmdsbbdo
spring.datasource.password=Hackathon2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# JSON e fuso horário
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# Segurança JWT
app.security.jwt.secret=SUBSTITUA_POR_UM_SEGREDO_FORTE_COM_MAIS_DE_32_CARACTERES
app.security.jwt.expiration-minutes=120

# CORS (Com todas as portas do front permitidas, incluindo a 5500 do Live Server)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500

# WhatsApp / Twilio
app.whatsapp.enabled=false
app.whatsapp.twilio.account-sid=
app.whatsapp.twilio.auth-token=
app.whatsapp.twilio.from=whatsapp:+14155238886

# Alertas
app.alertas.cron=0 0 * * * *
app.alertas.encaminhamento-pendente-horas=48

# API de dados abertos do SUS / CNES
app.cnes.base-url=https://apidadosabertos.saude.gov.br
app.cnes.timeout-ms=5000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logs
logging.level.root=INFO
logging.level.br.edu=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=INFO