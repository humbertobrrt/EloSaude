spring.application.name=projeto

server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:elo_saude;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

app.security.jwt.secret=${JWT_SECRET:troque-este-segredo-em-producao-use-48-bytes-ou-mais}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.whatsapp.twilio.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

app.alertas.cron=${ALERTAS_CRON:0 0 * * * *}
app.alertas.encaminhamento-pendente-horas=${ALERTAS_ENCAMINHAMENTO_HORAS:48}

app.cnes.base-url=${CNES_BASE_URL:https://apidadosabertos.saude.gov.br}
app.cnes.timeout-ms=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.br.edu=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}