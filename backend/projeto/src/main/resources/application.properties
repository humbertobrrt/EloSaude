# =====================================================================
# EloSaude - application.properties (somente Supabase, sem H2)
# Somente ASCII (sem acentos) para evitar erro de encoding no Maven.
# Segredos NUNCA ficam aqui: vem de variaveis de ambiente.
#
# Variaveis obrigatorias:
#   SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD, JWT_SECRET
# =====================================================================

spring.application.name=projeto
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Banco de dados - Supabase (PostgreSQL)
# Copie host, porta e usuario em: Supabase > Connect > Session pooler
#   SUPABASE_DB_URL=jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USER=postgres.<ref-do-projeto>
# Transaction pooler (porta 6543): acrescente &prepareThreshold=0 na URL.
# ---------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno por causa do plano gratuito do Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ---------------------------------------------------------------------
# Flyway - V1__schema_inicial.sql, V2__seed_unidades.sql
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------
# JPA / Hibernate - o schema e do Flyway, o Hibernate so valida
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ---------------------------------------------------------------------
# JSON e fuso horario
# ---------------------------------------------------------------------
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# Seguranca - JWT
# ---------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------------
# CORS - origens do frontend permitidas (separe por virgula)
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------------------------------------------------------------------
# WhatsApp (Twilio)
# ---------------------------------------------------------------------
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.whatsapp.twilio.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# ---------------------------------------------------------------------
# Lembretes e alertas de continuidade (@Scheduled)
# ---------------------------------------------------------------------
app.alertas.cron=${ALERTAS_CRON:0 0 * * * *}
app.alertas.encaminhamento-pendente-horas=${ALERTAS_ENCAMINHAMENTO_HORAS:48}

# ---------------------------------------------------------------------
# API publica de Dados Abertos do SUS (CNES)
# ---------------------------------------------------------------------
app.cnes.base-url=${CNES_BASE_URL:https://apidadosabertos.saude.gov.br}
app.cnes.timeout-ms=5000

# ---------------------------------------------------------------------
# Actuator e logs
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.elo.saude.dev=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}
spring.config.import=optional:file:.env[.properties]